<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Bombero Madrid</title>
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon.png?v=3">
<link rel="shortcut icon" href="favicon.ico?v=3">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=3">
<meta name="theme-color" content="#3b6d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* VOICE: sencillo y limpio, igual que las preguntas del chat
   IDEA: una hoja de test tranquila, sin adornos
   PICTURE: la pregunta y sus tres opciones son la imagen
   COLOUR and TYPE: fondo blanco, tinta gris oscura; verde acierto, rojo fallo, bloques azul/verde/rojo/amarillo; fuente del sistema
   LAYOUT: una columna de 720px */
:root{--bg:#ffffff;--ink:#1f1f1f;--mut:#6b6b6b;--line:#d9d9d9;--card:#f3f3f3;
--okb:#eaf3de;--okt:#27500a;--okl:#639922;--kob:#fcebeb;--kot:#791f1f;--kol:#e24b4a;
--inb:#e6f1fb;--int:#0c447c;--inl:#378add;--wab:#faeeda;--wat:#633806;--wal:#ba7517;--hl:#fff3a3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1a1a;--ink:#ececec;--mut:#a0a0a0;--line:#3a3a3a;--card:#262626;
--okb:#173404;--okt:#c0dd97;--okl:#639922;--kob:#501313;--kot:#f7c1c1;--kol:#e24b4a;
--inb:#042c53;--int:#b5d4f4;--inl:#378add;--wab:#412402;--wat:#fac775;--wal:#ba7517;--hl:#5c4d0a}}
:root[data-theme=dark]{--bg:#1a1a1a;--ink:#ececec;--mut:#a0a0a0;--line:#3a3a3a;--card:#262626;
--okb:#173404;--okt:#c0dd97;--okl:#639922;--kob:#501313;--kot:#f7c1c1;--kol:#e24b4a;
--inb:#042c53;--int:#b5d4f4;--inl:#378add;--wab:#412402;--wat:#fac775;--wal:#ba7517;--hl:#5c4d0a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:clip}
header{padding:20px max(5vw,16px) 0}
header .in{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0}
h1{font-size:22px}header small{display:block;font-size:13px;color:var(--mut);margin-top:2px}
main{max-width:720px;margin:auto;padding:20px max(5vw,16px) 56px}
button{font:inherit;cursor:pointer;border-radius:8px;min-height:44px;-webkit-appearance:none;appearance:none}
button:focus-visible,select:focus-visible{outline:3px solid var(--inl);outline-offset:2px}
.btn{background:var(--ink);color:var(--bg);border:0;padding:10px 20px;font-weight:500}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.home-btn{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px}
.stat{background:var(--card);border-radius:8px;padding:12px 14px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:600;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0 0 26px}
.mode{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mode h2{font-size:17px}.mode p{margin:0;color:var(--mut);font-size:14px}
.mode .btn{margin-top:auto}
select{font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
h3.sub{font-size:16px;margin:0 0 10px}
.bar{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.bar .tr{height:8px;background:var(--card);border-radius:4px;overflow:hidden}.bar .tr i{display:block;height:100%;background:var(--okl)}
.bar em{font-style:normal;text-align:right;color:var(--mut);white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px;font-size:13px;color:var(--mut)}
.prog{height:4px;background:var(--card);border-radius:2px;margin:0 0 16px;overflow:hidden}.prog i{display:block;height:100%;background:var(--inl);transition:width .3s}
.meta{font-size:12px;color:var(--mut);margin:0 0 6px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;margin-left:6px;background:var(--kob);color:var(--kot)}
.enun{font-size:16px;line-height:1.6;margin:0 0 14px}
.op{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 14px;margin:0 0 8px;font-size:15px;line-height:1.5}
.op:hover:not(:disabled){background:var(--card)}
.op:disabled{cursor:default}
.res{font-size:14px;font-weight:600;margin:10px 0 0}
.sec2{border-left:3px solid;border-radius:0;padding:10px 14px;margin:0 0 12px;font-size:15px;line-height:1.65}
.sec2 h4{margin:0 0 4px;font-size:13px;font-weight:600}
.sec2.q{background:var(--inb);border-color:var(--inl)}.sec2.q h4{color:var(--int)}
.sec2.p{background:var(--okb);border-color:var(--okl)}.sec2.p h4{color:var(--okt)}
.sec2.o{background:var(--kob);border-color:var(--kol)}.sec2.o h4{color:var(--kot)}
.sec2.r{background:var(--wab);border-color:var(--wal)}.sec2.r h4{color:var(--wat)}
mark{background:var(--hl);color:inherit;padding:0 3px;border-radius:3px}
.src{font-size:12px;color:var(--mut);margin:0 0 14px}
.nav{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.score{text-align:center;padding:16px 0 8px}
.score b{display:block;font-size:56px;font-weight:600;line-height:1.1}
.empty{color:var(--mut);background:var(--card);border-radius:8px;padding:14px}
details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 10px}
summary{cursor:pointer}
.note{font-size:12px;color:var(--mut);margin-top:24px}
@media(max-width:600px){.stats{gap:8px}.stat{padding:10px}.bar{grid-template-columns:minmax(0,7em) minmax(0,1fr) 3em}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
.today{border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.today h2{font-size:17px}.today p{margin:2px 0 0;color:var(--mut);font-size:14px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 8px}
.slot.lk{opacity:.6}.slot .btn{margin-top:4px}
.sh{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none;flex-wrap:wrap}.sh::-webkit-details-marker{display:none}
.hr{font-weight:600;min-width:3.2em}.st{font-size:14px}
.st.okr{color:var(--okt);font-weight:600}.st.kor{color:var(--kot);font-weight:600}.st.bl,.st.lk{color:var(--mut)}.st.pd{color:var(--int);font-weight:600}
.sq{font-size:12px;color:var(--mut);margin:6px 0}
.op.rv{cursor:default}.op.okc{background:var(--okb);border:2px solid var(--okl);color:var(--okt);font-weight:600}.op.koc{background:var(--kob);border:2px solid var(--kol);color:var(--kot);font-weight:600}
.dayrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.mut{color:var(--mut);font-size:14px}
.rk{display:grid;grid-template-columns:2em minmax(0,1fr) auto auto;gap:8px;align-items:center;border-left:3px solid;border-radius:0;padding:3px 8px;margin:0 0 3px;font-size:13px;line-height:1.3}
.rk.pass{background:var(--okb);border-color:var(--okl);color:var(--okt)}.rk.fail{background:var(--kob);border-color:var(--kol);color:var(--kot)}
.rk .pos{font-size:14px;font-weight:600}.rk .who b{font-weight:600;font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .why{display:block;font-size:11px;opacity:.85}
.rk .sc{text-align:right}.rk .sc{display:flex;gap:14px;align-items:baseline;white-space:nowrap}.rk .sc .ac{font-size:13px;opacity:.8}.rk .sc b{font-size:14px;font-weight:700}.rk .sc span{font-size:11px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs a{color:var(--ink);text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:8px}.tabs a:hover{background:var(--card)}
.start{text-align:center;padding:36px 0}.start h2{font-size:22px;margin:4px 0 6px}.start p{color:var(--mut);margin:0 0 26px}
.go{background:#3b6d11;color:#fff;border:0;border-radius:14px;font-size:24px;font-weight:700;letter-spacing:1px;padding:22px 56px;min-height:72px;width:min(100%,360px)}.go:hover{background:#27500a}
.pushbox{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--inl);background:var(--inb);border-radius:12px;padding:12px 16px;margin:0 auto 18px;max-width:520px}.pushbox b{display:block;color:var(--int)}.pushbox span{display:block;font-size:14px;color:var(--ink)}.pushbox .pe{color:var(--kot);font-size:13px}
.sumt{font-size:17px;text-align:center;margin:26px 0 4px}.sumh{font-size:14px;margin:14px 0 6px}.sumq{border:1px solid var(--line,#ddd);border-radius:8px;margin:0 0 6px;padding:6px 10px;font-size:13px}.sumq summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}.sumpct{font-weight:700;color:var(--kot);min-width:3em}.sumd{font-size:12px;opacity:.8;margin:8px 0 4px}.sumko{font-weight:600;color:var(--kot);margin:0 0 4px}.sumok{font-weight:600;color:var(--okt);margin:0 0 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}.mbox{background:var(--bg,#fff);color:inherit;max-width:560px;width:100%;border-radius:12px;padding:18px 16px}.podio{margin:0 0 6px;padding-left:22px;font-size:14px}
.note a{color:#185FA5;text-decoration:underline;font-weight:600}@media (prefers-color-scheme:dark){.note a{color:#85B7EB}}

.maq-ov{position:fixed;inset:0;background:rgba(10,10,10,.9);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;overflow:auto}
.cab{width:210px;margin-top:44px;background:#c0241a;border:3px solid #2d1616;border-radius:16px 16px 8px 8px;padding:0 9px 11px;box-sizing:border-box;position:relative;box-shadow:inset 0 -5px 0 #8f1a12,inset 0 3px 0 #e5483c}
.cab .masc{position:absolute;left:50%;top:-58px;transform:translateX(-50%)}
.cab .marq{margin:0 -9px 9px;background:#2d1616;border-radius:13px 13px 0 0;padding:9px 6px 6px}
.cab .marq h3{margin:0;font-family:'Press Start 2P',monospace;font-size:9px;color:#ffd23c;text-align:center;text-shadow:2px 2px 0 #c0241a;font-weight:400}
.cab .bulbs{display:flex;justify-content:space-between;margin-top:6px}
.cab .bulbs i{width:6px;height:6px;border-radius:50%;background:#ffd23c;display:block;animation:mbl 1s steps(1) infinite}
.cab .bulbs i:nth-child(even){animation-delay:.5s}
@keyframes mbl{50%{background:#7a5a10}}
.cab.win .bulbs i{animation:mbw .16s steps(1) infinite!important}
@keyframes mbw{50%{background:#fff;box-shadow:0 0 6px #ffd23c}}
.cab .wnd{background:#2d1616;border-radius:8px;padding:5px;position:relative}
.cab .reels{display:flex;gap:5px;justify-content:center}
.cab .reel{width:54px;height:62px;background:linear-gradient(#ddd 0,#fff 18%,#fff 82%,#ddd 100%);border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cab .reel.spin>*{animation:msp .1s linear infinite}
.cab .reel.slow>*{animation:msp .22s linear infinite}
@keyframes msp{0%{transform:translateY(-20px);opacity:.35}50%{opacity:1}100%{transform:translateY(20px);opacity:.35}}
.cab .reel.stop>*{animation:mbo .38s ease-out}
@keyframes mbo{0%{transform:translateY(-16px)}55%{transform:translateY(5px)}80%{transform:translateY(-2px)}100%{transform:translateY(0)}}
.cab .reel.tense{box-shadow:0 0 0 2px #ffd23c,0 0 10px #ffd23c;animation:mtp .3s steps(1) infinite}
@keyframes mtp{50%{box-shadow:0 0 0 2px #fa821e,0 0 4px #fa821e}}
.cab .pay{position:absolute;left:2px;right:2px;top:50%;height:2px;background:rgba(215,45,30,.55);pointer-events:none}
.cab.win .pay{background:#ffd23c;height:3px;box-shadow:0 0 8px #ffd23c}
.cab .lever{position:absolute;right:-16px;top:74px;width:6px;height:48px;background:#8c8c8c;border:2px solid #2d1616;border-radius:3px;transform-origin:bottom center;transition:transform .25s}
.cab .lever::before{content:'';position:absolute;top:-13px;left:-6px;width:14px;height:14px;border-radius:50%;background:#d72d1e;border:2px solid #2d1616}
.cab .lever.down{transform:scaleY(-0.55) translateY(-18px)}
.msnd{position:absolute;right:7px;bottom:7px;line-height:0;cursor:pointer;z-index:3;user-select:none}
.mbtn{display:block;margin-top:11px;width:100%;font-family:'Press Start 2P',monospace;font-size:12px;color:#fff!important;background:#3B9D11!important;border:3px solid #2d1616!important;border-radius:8px;padding:9px 0 8px;box-shadow:0 4px 0 #1f5a08;cursor:pointer;text-shadow:2px 2px 0 #1f5a08}
.mbtn.sec{background:#ffd23c!important;color:#2d1616!important;text-shadow:none;box-shadow:0 4px 0 #a07c10;font-size:9px}
.mbtn:active,.mbtn:disabled{transform:translateY(3px);box-shadow:0 1px 0 #1f5a08}
.mres{margin:10px 0 0;min-height:26px;font-family:'Press Start 2P',monospace;font-size:7px;line-height:1.7;color:#fffaf0;text-align:center}
.coin{position:fixed;top:-12px;width:8px;height:8px;background:#ffd23c;border:2px solid #2d1616;box-sizing:border-box;animation:mfall linear forwards;z-index:101;pointer-events:none}
@keyframes mfall{to{transform:translateY(110vh) rotate(360deg)}}
.cab.shake{animation:msh .35s}
@keyframes msh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.vbox{background:var(--bg);border-radius:12px;padding:16px;max-width:360px;width:100%;max-height:80vh;overflow:auto}
.vbox h3{margin:0 0 4px;font-size:17px}
.combar{background:var(--card);border-radius:8px;padding:10px 12px;margin:0 0 14px}
.cpills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cpill{font-size:12px;padding:3px 9px;border-radius:12px;border:1px solid var(--line)}
.cpill.off{opacity:.55}
.lanz{display:flex;align-items:center;justify-content:space-between;gap:10px}.lvis{flex:none;min-height:0;height:auto;width:auto;margin:0;line-height:1.4;box-shadow:none;font:inherit;font-size:12px;font-weight:600;padding:3px 12px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
.sabn,.sabq{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:8px;background:#FAEEDA;color:#633806;border-left:3px solid #BA7517}
.cw{display:flex;gap:18px;justify-content:center;margin:18px 0 6px}
.cico{position:relative;display:inline-block;line-height:0;cursor:pointer;transition:transform .15s;padding:2px;transform-origin:center bottom;background:none;border:0;outline:none}
.cico:hover,.cico:focus-visible{transform:scale(2);z-index:2}
.cico i{position:absolute;left:50%;bottom:100%;transform:translateX(-50%) scale(.5);transform-origin:center bottom;white-space:nowrap;font-style:normal;font-size:11px;line-height:1.3;background:#fffaf0;color:#2d1616;padding:2px 6px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s;margin-bottom:2px}
.cico:hover i,.cico:focus-visible i{opacity:1}
.hchu{margin-left:auto;align-self:center}
.hchu .cw{margin:0}
.hchu .cico i{top:100%;bottom:auto;transform-origin:center top;margin:2px 0 0}
.pila{display:inline-flex}
.pila .cico+.cico{margin-left:-15px}
.pila .cico[data-t="esc"]+.cico{margin-left:-9px}
.pila .cico:hover,.pila .cico:focus-visible{z-index:5}
.cico.bote{animation:cbote .35s ease-out forwards}
@keyframes cbote{0%{transform:scale(1)}40%{transform:scale(2.2) translateY(-4px)}100%{transform:scale(0)}}
.op.tach{text-decoration:line-through;opacity:.35!important;pointer-events:none}

#maq .tbox{position:relative;display:flex;flex-direction:column;align-items:center;width:280px}
#maq .ttl{font-family:'Press Start 2P',monospace;font-size:9px;color:#ffd23c;text-shadow:2px 2px 0 #b8302a;margin:0 0 16px}
#maq .trk{position:relative;width:268px;height:150px}
#maq .ladder{position:absolute;left:96px;top:6px;width:162px;height:12px;border:3px solid #2d1616;background:repeating-linear-gradient(90deg,#c8c8c8 0 14px,#2d1616 14px 17px);border-radius:3px;z-index:1;box-sizing:content-box}
#maq .tbody{position:absolute;left:90px;top:22px;width:176px;height:92px;background:#e8392c;border:3px solid #2d1616;border-radius:6px 10px 6px 6px;box-sizing:border-box;box-shadow:inset 0 -8px 0 #b82a20,inset 0 4px 0 #ff6b5e}
#maq .stripe{position:absolute;left:0;right:0;bottom:16px;height:7px;background:#fffaf0;border-top:2px solid #2d1616;border-bottom:2px solid #2d1616;box-sizing:content-box}
#maq .tcab{position:absolute;left:2px;top:30px;width:94px;height:84px;background:#e8392c;border:3px solid #2d1616;border-radius:30px 6px 6px 8px;box-sizing:border-box;box-shadow:inset 0 -8px 0 #b82a20,inset 0 4px 0 #ff6b5e}
#maq .wind{position:absolute;left:8px;top:7px;width:62px;height:40px;background:#c8ebff;border:3px solid #2d1616;border-radius:22px 4px 4px 4px;overflow:hidden;box-sizing:border-box}
#maq .drv{position:absolute;left:14px;top:2px;line-height:0}
#maq .glare{position:absolute;left:4px;top:4px;width:8px;height:14px;background:rgba(255,255,255,.7);border-radius:4px;transform:skewX(-15deg)}
#maq .moving .drv{animation:tbob .25s steps(2) infinite}
@keyframes tbob{50%{transform:translateY(1px)}}
#maq .siren{position:absolute;left:40px;top:-16px;width:26px;height:13px;border:3px solid #2d1616;border-bottom:0;border-radius:9px 9px 0 0;background:#d72d1e;z-index:2;animation:tsir .5s steps(1) infinite;box-sizing:border-box}
@keyframes tsir{50%{background:#378ADD}}
#maq .spin .siren,#maq .win .siren{animation-duration:.15s}
#maq .twnd{position:absolute;left:8px;top:12px;display:flex;gap:5px}
#maq .reel{width:50px;height:56px;background:#fffaf0;border:3px solid #2d1616;border-radius:8px;box-sizing:border-box}
#maq .twheel{position:absolute;bottom:4px;width:34px;height:34px;border-radius:50%;background:#2d1616;display:flex;align-items:center;justify-content:center;z-index:2}
#maq .twheel i{width:16px;height:16px;border-radius:50%;background:#c8c8c8;border:3px solid #8c8c8c;box-sizing:border-box;position:relative}
#maq .twheel i::after{content:'';position:absolute;left:50%;top:-1px;width:2px;height:12px;margin-left:-1px;background:#505050}
#maq .moving .twheel i{animation:trot .25s linear infinite}
@keyframes trot{to{transform:rotate(360deg)}}
#maq .trk.moving{animation:tshake .12s steps(2) infinite}
@keyframes tshake{50%{transform:translateY(-1px)}}
#maq .bumper{position:absolute;left:-2px;bottom:14px;width:10px;height:10px;background:#c8c8c8;border:3px solid #2d1616;border-radius:3px;box-sizing:border-box}
#maq .tlight{position:absolute;left:2px;top:84px;width:8px;height:8px;background:#ffd23c;border:2px solid #2d1616;border-radius:2px;z-index:3}
#maq .mbtn{width:220px;margin-top:14px;border-radius:22px!important;background:#4cb81c!important;box-shadow:0 4px 0 #2a7a0c,inset 0 3px 0 #8be35a}
#maq .msnd{position:static;margin-top:10px}
#maq .reel.tense{box-shadow:0 0 0 2px #ffd23c,0 0 10px #ffd23c}

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function planUpTo(k){
  if(PLAN[k])return PLAN[k];
  const all=BANK.slice().sort((a,b)=>a.id-b.id),hard=all.filter(q=>q.d==='difícil');
  const byT={};all.filter(q=>q.d!=='difícil').forEach(q=>(byT[q.t]=byT[q.t]||[]).push(q));
  hard.forEach(q=>{if(!byT[q.t])byT[q.t]=[q]});
  const ts=Object.keys(byT).sort(),used={},ptr={};ts.forEach(t=>{used[t]=0;ptr[t]=0});
  let hp=0;
  for(let t=T0,d=0;t<=parse(k);t+=864e5,d++){
    const key=keyOf(t);if(new Date(t).getUTCDay()===0)continue;
    const r=rng(d*7919+13),tie={};ts.forEach(x=>tie[x]=r());
    const last=hard.length?hard[hp++%hard.length]:null;
    const order=ts.filter(x=>!last||x!==last.t).sort((a,b)=>used[a]-used[b]||tie[a]-tie[b]);
    const n=last?11:12,pick=[];for(let i=0;i<n;i++)pick.push(order[i%order.length]);
    for(let i=pick.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pick[i],pick[j]]=[pick[j],pick[i]]}
    const day=pick.map(x=>{const q=byT[x][ptr[x]%byT[x].length];ptr[x]++;used[x]++;return q});
    if(last){day.push(last);used[last.t]=(used[last.t]||0)+1}
    PLAN[key]=day;
  }
  return PLAN[k]||[];
}

function tono(f,d,type,vol,when,slide){if(!sonidoOn())return;try{if(!ACX)ACX=new (window.AudioContext||window.webkitAudioContext)();if(ACX.state==='suspended')ACX.resume();const o=ACX.createOscillator(),g=ACX.createGain(),t=ACX.currentTime+(when||0);o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ACX.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={
  lever:()=>{tono(180,.12,'square',.08,0,90);tono(90,.08,'triangle',.12,.1)},
  tick:()=>tono(900+Math.random()*300,.025,'square',.03),
  stop:()=>{tono(220,.07,'square',.1);tono(110,.09,'triangle',.14,.02)},
  tense:()=>{for(let i=0;i<8;i++)tono(330+i*45,.11,'square',.05,i*.17)},
  win:()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tono(f,i===6?.45:.12,'square',.08,i*.11));[262,330,392].forEach((f,i)=>tono(f,.3,'triangle',.08,.33+i*.11))},
  lose:()=>{tono(392,.16,'square',.07);tono(311,.16,'square',.07,.17);tono(247,.32,'square',.07,.34)}};
const SND_ON=["....K.......","...KK...K...","KKKWK..K.K..","KWWWK.K..K..","KWWWK.K..K..","KWWWK.K..K..","KKKWK..K.K..","...KK...K...","....K......."];
const SND_OFF=["....K.......","...KK.......","KKKWK.K...K.","KWWWK..K.K..","KWWWK...K...","KWWWK..K.K..","KKKWK.K...K.","...KK.......","....K......."];
function sndIco(on){return `<svg width="22" height="17" viewBox="0 0 12 9" shape-rendering="crispEdges" aria-hidden="true">${pxRects(on?SND_ON:SND_OFF,{K:'e0ddd5',W:'5f5e5a'})}</svg>`}

let SAB=[];
async function cargarSabotajes(){
  if(!FS||!PID)return;
  try{
    const {fs,db}=FS,qs=await fs.getDocs(fs.query(fs.collection(db,'sabotajes'),fs.where('to','==',PID),fs.where('usado','==',false)));

async function elegirVictima(){
  if(!FS){const o=document.createElement('div');o.className='maq-ov';o.innerHTML='<div class="vbox"><h3>Sin conexión</h3><p class="note">Ahora mismo no se puede lanzar el Chulito. Lo conservas: inténtalo en un rato.</p><button class="btn" style="margin-top:10px">Vale</button></div>';o.querySelector('button').onclick=()=>o.remove();document.body.appendChild(o);return}

  document.body.appendChild(ov);
  document.getElementById('vno').onclick=()=>{ov.remove();render()};
  let L=[];
  try{L=(await FS.fs.getDocs(FS.fs.collection(FS.db,'ranking'))).docs.map(d=>({pid:d.id,n:d.data().nombre||''})).filter(x=>x.pid!==PID&&x.n).sort((a,b)=>a.n.localeCompare(b.n,'es'))}catch(e){}
  const vl=document.getElementById('vlist');
  if(!L.length){vl.innerHTML='<p class="note">No hay compañeros a los que sabotear todavía.</p>';return}
  vl.innerHTML=L.map((x,i)=>`<button class="op vic" data-i="${i}"></button>`).join('');
  vl.querySelectorAll('.vic').forEach(b=>{const x=L[+b.dataset.i];b.textContent=x.n;b.onclick=async()=>{
    if(comCount().chu<1){ov.remove();return}
    vl.querySelectorAll('button').forEach(z=>z.disabled=true);
    try{
      const {fs,db}=FS,lim=fs.doc(db,'chulimite',x.pid+'_'+madrid().key);
      const ok=await fs.runTransaction(db,async tr=>{
        const d=await tr.get(lim),n=d.exists()?d.data().n:0;
        if(n>=2)return false;
        tr.set(lim,{n:n+1});
        tr.set(fs.doc(fs.collection(db,'sabotajes')),{to:x.pid,from:PID,fromName:NAME.slice(0,30),toName:x.n.slice(0,30),dia:madrid().key,t:Date.now(),usado:false});

      });
      if(!ok){vl.querySelectorAll('button').forEach(z=>z.disabled=false);b.disabled=true;b.textContent=x.n+' · ya ha recibido 2 hoy';return}
      gastar('chu-'+Date.now(),'chu');

      ov.querySelector('.vbox b').textContent=x.n;
      document.getElementById('vok').onclick=()=>{ov.remove();render()};
    }catch(e){vl.innerHTML='<p class="note">No se ha podido lanzar por un problema de conexión. Conservas tu Chulito: inténtalo de nuevo en un rato.</p>'}
  }});
}

const diaHecho=k=>hasDay(k)&&HOURS.every(h=>(S.daily[k]||{})[h]);
function racha(hoy){let n=0,t=parse(hoy);if(diaHecho(hoy))n++;t-=864e5;
  for(let i=0;i<400;i++,t-=864e5){const k=keyOf(t);if(dow(k)===0||!hasDay(k))continue;if(diaHecho(k))n++;else break}return n}

const LLAMA_PAL=[null,null,{K:'2d1616',R:'fa821e',O:'ffd23c',Y:'fff3a0',W:'ffffff'},{K:'10204a',R:'2a5bd7',O:'4ea1ff',Y:'a8e0ff',W:'ffffff'},{K:'10204a',R:'2a5bd7',O:'4ea1ff',Y:'a8e0ff',W:'ffffff',Z:'7fd0ff',Q:'2f6fb0'}];
const LLAMA_SPK=[null,['fff3a0','fa821e'],['ffffff','ffd23c'],['ffffff','4ea1ff'],['ffffff','7fd0ff']];
function llamaNivel(n){return n>=48?4:n>=24?3:n>=12?2:n>=6?1:0}
function llamaRacha(n,px){const l=llamaNivel(n),g=l===4?LLAMA_AURA:PX.icons.llama,cm=LLAMA_PAL[l]||PXC,w=Math.max(...g.map(r=>r.length)),h=g.length,s=Math.max(w,h);

function day(k){
  run=null;homeBtn.hidden=true;window.scrollTo(0,0);
  const now=madrid(),today=k===now.key,past=k<now.key;
  if(dow(k)===0||k>now.key){app.innerHTML=`<p class="empty">${dow(k)===0?'Los domingos no hay preguntas.':'Ese día todavía no ha llegado.'}</p>`;return}
  const rows=HOURS.map(h=>{
    const s=slot(k,h),q=s.q,locked=today&&h>now.hour;
    if(!q)return `<div class="slot lk"><div class="sh"><span class="hr">${h}:00</span><span class="st lk">Sin publicar</span></div></div>`;
    let state,cls='';
    const de=(S.daily[k]||{})[h]||{};
    if(s.done){state=de.wa!==undefined?'Escudo · 0':s.a===null?'En blanco · 0':s.a===q.c?'✓ Acierto · +1':'✗ Fallo · −0,33';cls=s.a===null?'bl':s.a===q.c?'okr':'kor'}
    else if(locked){state=`Disponible a las ${h}:00`;cls='lk'}
    else if(today){state='Pendiente de responder';cls='pd'}
    else{state='Sin responder · 0';cls='bl'}
    const head=`<span class="hr">${h}:00</span><span class="st ${cls}">${state}</span>`;
    if(locked)return `<div class="slot lk"><div class="sh">${head}</div></div>`;
    if(today&&!s.done)return `<div class="slot"><div class="sh">${head}</div></div>`;

function drawRanking(){

function glosPrep(){GLOS.forEach((g,i)=>{g.i=i;g.re=g.a.map(a=>new RegExp('(^|[^\\wáéíóúüñÁÉÍÓÚÜÑ])('+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\wáéíóúüñÁÉÍÓÚÜÑ])',/^[A-Z0-9./]+$/.test(a)?'':'i'))})}

function gDeQ(q){if(!q._g){const T=gTexto(q);q._g=GLOS.filter(g=>(!g.solo||g.tema===q.t)&&g.re.some(r=>r.test(T))).map(g=>g.i)}return q._g}

function marcarTerminos(root,q){
  if(!root||!q||!GLOS.length)return;const ids=gDeQ(q);if(!ids.length)return;
  const terms=ids.map(i=>GLOS[i]).sort((a,b)=>Math.max(...b.a.map(x=>x.length))-Math.max(...a.a.map(x=>x.length)));
  for(const g of terms){let hecho=false;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.gt,button,.vpc,.res')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});

      const resto=n.splitText(i);resto.splitText(m[2].length);sp.textContent=resto.data;resto.replaceWith(sp);hecho=true;break}}}}
}

  const tot=[0,1,2,3].reduce((t,i)=>t+(v['o'+i]||0),0);if(!tot)return;
  els.forEach(el=>{if(el.querySelector('.vpc'))return;const o=+el.dataset.o,p=Math.round((v['o'+o]||0)*100/tot);
    const tx=el.innerHTML;el.innerHTML=`<span class="vbar"></span><span class="vt">${tx}</span><span class="vpc" data-p="${p}">0 %</span>`;el.classList.add('vot');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.querySelector('.vbar').style.width=p+'%'}))});
  const t0=performance.now();(function cuenta(t){const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);
    els.forEach(el=>{const s=el.querySelector('.vpc');if(s)s.textContent=Math.round(s.dataset.p*e)+' %'});if(k<1)requestAnimationFrame(cuenta)})(t0);
}
function paint(el,k){
  const ok=k==='ok';el.classList.add(ok?'okc':'koc');
  el.style.setProperty('background',ok?'var(--okb)':'var(--kob)','important');
  el.style.setProperty('border',ok?'2px solid var(--okl)':'2px solid var(--kol)','important');
  el.style.setProperty('color',ok?'var(--okt)':'var(--kot)','important');
  el.style.setProperty('font-weight','600','important');
  el.style.setProperty('opacity','1','important');
}

// ===== Celebración 12 de 12 (una vez por día) =====
const MASC_FELIZ=["...K.......K", "..KYK.....KY", "..KYOK...KYO", "..KOOK..KKKK", "...KORKKNNNN", "...KRKNNNNNG", "...KRKNNNNGG", "..KKKKKKKKKK", "..KRRRRRRRRR", ".KRRRRRRRRRR", ".KROOOOOOOOO", ".KROOKKOOOOO", ".KROKOOKOOOO", "KRROOOOOOOOO", "KROPPOKWWWWW", "KRROOKWWWWWW", ".KRROKWSWWWW", "..KRRKWSWWSW", ".KRROKWSWWSW", "KRRYKWWSWWSW", "KOKYKWSWWSWW", "KOKYKSWWSWWW", ".KRYKSWWSWWW", ".KRYYKSWWSWW", ".KRRYKSWWSWW", "..KRRKSWSWWW", "..KRRKSWSWWW", "..KOOKKSWSWW", "..KKKK.KSWSW", ".......KSWSW", "........KSWW", "........KSWW", ".......KSWWS", "........KWSW", ".........KSW", ".........KWW", "..........KW", "..........KK"];
const MASC_C={K:'2d1616',N:'23376e',G:'f5c32d',R:'de3422',O:'fa8723',Y:'ffd446',W:'fff8e1',P:'ff788c',S:'c8c8d2'};
function mascFeliz(sz){const g=MASC_FELIZ.map(r=>r+r.split('').reverse().join(''));return `<svg width="${Math.round(sz*24/38)}" height="${sz}" viewBox="0 0 24 38" shape-rendering="crispEdges" aria-hidden="true">${pxRects(g,MASC_C)}</svg>`}
function diaPerfecto(k){const d=S.daily[k]||{};return HOURS.every(h=>{const e=d[h],q=e&&byId(e.id);return q&&e.a===q.c})}
function fiesta(k){
  if(lsGet('fiesta')===k||!diaPerfecto(k))return;lsSet('fiesta',k);
  const ov=document.createElement('div');ov.className='fiesta';
  ov.innerHTML=`<div class="fbox"><div class="fmasc">${mascFeliz(120)}</div><div class="ftit">¡12 de 12!</div><p>Día perfecto</p><button class="btn" id="fok">¡Vamos!</button></div>`;
  document.body.appendChild(ov);
  const box=ov.querySelector('.fbox'),cols=['#ffd23c','#de3422','#fa8723','#7bd389','#6fb6ff'];
  for(let i=0;i<34;i++){const c=document.createElement('i');c.className='fcf';c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.animationDelay=(Math.random()*.7)+'s';box.appendChild(c)}
  [523,659,784,1047,784,1047,1319].forEach((f,i)=>tono(f,i===6?.45:.13,'square',.08,i*.12));[262,330,392].forEach((f,i)=>tono(f,.3,'triangle',.08,.36+i*.12));vib([60,40,60,40,200]);
  ov.querySelector('#fok').onclick=()=>ov.remove();
}
function answer(o){
  const {q}=run.qs[run.i],blank=o===null,ok=o===q.c;
  if(run.mode==='dia'){
    const {k,h}=run.ctx;
    const today=madrid().key;
    if(k!==today){app.innerHTML='<p class="empty">Este día ya ha terminado: la pregunta solo se podía responder ese día.</p>';return}
    if((S.daily[k]||{})[h]){go('dia-'+k);return}
    const esc=!!(S.gasto||{})['esc-'+k+'-'+h];
    if(esc&&!blank&&!ok){run.escFail=true}
    const ent={id:q.id,a:blank||run.escFail?null:o};if(run.escFail)ent.wa=o;if(esc)ent.esc=1;if(run.sab)ent.sab=run.sab.fromName;
    S.daily[k]=Object.assign({},S.daily[k],{[h]:ent});
    if(run.sab)marcarSabotaje(run.sab,q.id,blank?'bl':run.escFail?'esc':ok?'ok':'ko');

    setTimeout(()=>fiesta(k),900);
  }
  if(!blank)record(q,ok);
  save();
  if(run.mode==='simulacro'){run.ans.push(o);next();return}
  app.querySelectorAll('#ops .op').forEach(b=>{
    const v=+b.dataset.o;b.disabled=true;
    if(v===q.c)paint(b,'ok');else if(v===o)paint(b,'ko');else b.style.setProperty('opacity','0.5','important');
  });
  {const els=app.querySelectorAll('#ops .op');const vp=(run.mode==='dia'&&!blank)?votar(q.id,o):Promise.resolve();vp.finally(()=>votosEn(els,q.id))}
  const cw=document.getElementById('cw');if(cw)cw.remove();
  const correctL=L[run.qs[run.i].ord.indexOf(q.c)];
  run.net+=run.escFail?0:ptsOf(blank?null:o,q);
  const pts=blank||run.escFail?'0 netas':ok?'+1 neta':'−0,33 netas';
  document.getElementById('after').innerHTML=`<p class="res" style="color:var(${blank?'--mut':ok?'--okt':'--kot'});margin-bottom:14px">${blank?'En blanco. La buena es la '+correctL:ok?'Correcto':'Incorrecto. La buena es la '+correctL}${run.escFail?' · El escudo te ha salvado':''} · ${pts}</p>${expl(q)}`;
  marcarTerminos(app,q);
  const last=run.i+1>=run.qs.length;
  const more=run.mode==='dia'&&pending();
  document.getElementById('nav').innerHTML=`<button class="btn" id="nx">${run.mode==='dia'?(more?'Siguiente pregunta':'Continuar'):last?'Terminar':'Siguiente'}</button>`;
  document.getElementById('nx').onclick=run.mode==='dia'?()=>{location.hash==='#inicio'||!location.hash||location.hash==='#hoy'?home():go('inicio')}:next;
}

function next(){run.i++;run.i<run.qs.length?show():finish()}

function finish(){
  window.scrollTo(0,0);
  if(run.mode!=='simulacro'){
    app.innerHTML=`<div class="score"><h2>Ronda terminada</h2><p>${run.qs.length} preguntas · ${fmt(run.net)} netas</p></div><div class="nav" style="justify-content:center"><button class="btn" id="h">Volver al inicio</button></div>`;
    document.getElementById('h').onclick=()=>go('inicio');return}
  let a=0,f=0,bl=0;run.qs.forEach(({q},k)=>{const v=run.ans[k];v===null?bl++:v===q.c?a++:f++});
  const n=run.qs.length,neta=a-0.33*f,nota=Math.max(0,neta*10/n);
  const wrong=run.qs.map((x,k)=>({...x,v:run.ans[k]})).filter(x=>x.v!==x.q.c);
  app.innerHTML=`
  <div class="score"><span>Nota (sobre 10, con penalización)</span><b>${nota.toFixed(2).replace('.',',')}</b>
  <p>${a} aciertos · ${f} fallos · ${bl} en blanco · ${fmt(neta)} netas</p></div>
  <h3 class="sub">${wrong.length?'Revisa las que no acertaste':'Ninguna fallada. Muy bien.'}</h3>
  ${wrong.map(({q,v})=>`<details><summary>${esc(q.q)}</summary>${qimg(q)}
    <p style="margin:10px 0 4px;color:var(--kot)">${v===null?'En blanco':'Tu respuesta: '+esc(q.o[v])}</p>
    <p style="margin:0 0 12px;color:var(--okt);font-weight:600">Correcta: ${esc(q.o[q.c])}</p>${expl(q)}</details>`).join('')}
  <div class="nav" style="justify-content:center"><button class="btn" id="h">Volver al inicio</button></div>`;
  document.getElementById('h').onclick=()=>go('inicio');
}

function askName(change){
  homeBtn.hidden=true;
  app.innerHTML=`<form id="nf" class="mode" style="max-width:420px;margin:24px auto">
  <h2>${change?'Cambiar PIN':'Entrar'}</h2>
  <p>${change?'Elige un PIN nuevo de 4 dígitos.':'Escribe tu nombre y un PIN de 4 dígitos. Si es tu primera vez, elige el PIN que quieras y recuérdalo: con el mismo nombre y PIN entrarás desde el móvil o el ordenador y verás tu progreso.'}</p>
  ${change?'':`<input id="nm" maxlength="30" autocomplete="name" placeholder="Nombre y apellido" style="font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)">`}
  <input id="pn" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="PIN de 4 dígitos" style="font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);letter-spacing:6px;font-family:monospace">
  <p id="ne" style="color:var(--kot);font-size:13px;margin:0" hidden></p>
  <button class="btn" id="nb">${change?'Guardar PIN':'Entrar'}</button>${change?'<button type="button" class="btn sec" id="nc">Cancelar</button>':''}</form>`;
  const ne=document.getElementById('ne'),nm=document.getElementById('nm'),pn=document.getElementById('pn'),nb=document.getElementById('nb');
  (nm||pn).focus();[nm,pn].forEach(x=>x&&(x.oninput=()=>ne.hidden=true));
  const nc=document.getElementById('nc');if(nc)nc.onclick=()=>go('inicio');
  document.getElementById('nf').onsubmit=async e=>{e.preventDefault();
    const name=nm?nm.value.trim():NAME,pin=pn.value.trim();
    const err=msg=>{ne.textContent=msg;ne.hidden=false};
    if(!change&&norm(name).length<2)return err('Escribe tu nombre para continuar.');
    if(!/^[0-9]{4}$/.test(pin))return err('El PIN tiene que tener 4 números.');
    nb.disabled=true;const r=change?await changePin(pin):await login(name,pin);nb.disabled=false;
    if(r)return err(r);go('inicio');render()};
}
let lastPend=null;
setInterval(()=>{if(!BANK.length||run||!lsGet('key'))return;const p=pending(),k=p?p.k+'-'+p.h:'';if(lastPend!==null&&k&&k!==lastPend&&(location.hash===''||location.hash==='#inicio'||location.hash==='#hoy')){home.go=false;home()}lastPend=k},30000);
homeBtn.onclick=()=>go('inicio');
window.addEventListener('hashchange',render);
loadLocal();
if(!S.start){S.start=madrid().key}
try{NAME=localStorage.getItem(LS+'-nombre')||''}catch(e){}
if(!lsGet('key'))NAME='';
fetch('laboratorio.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{LAB=d}).catch(()=>{});
fetch('glosario.json',{cache:'no-cache'}).then(r=>r.json()).then(g=>{GLOS=g;glosPrep()}).catch(()=>{});
Promise.all([fetch('preguntas.json',{cache:'no-cache'}).then(r=>r.json()),fetch('plan.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{}).catch(()=>({}))]).then(([d,p])=>{BANK=d;FIXED=p||{};render();connect()}).catch(()=>{app.innerHTML='<p class="empty">No se han podido cargar las preguntas. Recarga la página.</p>'});
}
</script>
